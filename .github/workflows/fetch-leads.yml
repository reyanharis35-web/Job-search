name: Refresh live leads

on:
  schedule:
    - cron: "47 4 * * *"   # daily 04:47 UTC (06:47 Berlin in summer, 05:47 in winter)
  workflow_dispatch: {}      # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: fetch-leads
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch postings
        run: python3 scripts/fetch_leads.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- leads.md scripts/leads_state.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "leads-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leads.md scripts/leads_state.json
          git commit -m "Refresh live leads $(date -u +%F)"
          git push
